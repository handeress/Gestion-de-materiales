<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d46">
<link rel="manifest" href="manifest.json">

<title>Gestión de materiales</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--pri:#2f5d46;--pri2:#e3eee7;--bor:#dedad2;--bad:#b3261e;--badbg:#fbe9e7;--ok:#1e7a46;--okbg:#e2f3e8;--wa:#1f9d55;--warn:#8a5a00;--warnbg:#fff3d6}
@media (prefers-color-scheme:dark){:root{--bg:#141614;--card:#1e211f;--tx:#ecebe7;--mut:#a3a29c;--pri:#3d7a5b;--pri2:#23332a;--bor:#2f332f;--bad:#f2b8b5;--badbg:#3a1f1d;--ok:#8fd6a8;--okbg:#1d3326;--wa:#5fd08f;--warn:#f3cd75;--warnbg:#3a2f14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
body.noscroll{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;padding:4px;display:flex;cursor:pointer}
main{padding:12px 16px 130px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bor);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--pri);font-weight:700}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.acc svg.i,.btn svg.i{width:19px;height:19px}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--pri);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bor);border-radius:14px;margin:0 0 10px;overflow:hidden}
.card-main{display:block;padding:12px 14px;color:inherit;text-decoration:none}
.pad{padding:12px 14px}
.nom{font-weight:600;font-size:17px}
.sub,.mut{color:var(--mut);font-size:14px}
.stars{color:#d49a12;font-size:14px;letter-spacing:1px}
.accs{display:flex;border-top:1px solid var(--bor)}
.acc{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 4px;color:var(--pri);text-decoration:none;font-weight:600;font-size:14px;border-right:1px solid var(--bor)}
.acc:last-child{border-right:0}
.acc.wa{color:var(--wa)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bor);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;white-space:nowrap;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bor);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:0;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.hoja h2{margin:2px 0 6px;font-size:20px}
.frm label:not(.btn),.frm .lbl{display:block;font-size:13px;color:var(--mut);margin:12px 0 0}
.frm label:not(.btn)>input,.frm label:not(.btn)>select,.frm label:not(.btn)>textarea,.frm label:not(.btn)>.conbtn{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:600;padding:11px 16px;min-height:46px;text-decoration:none;cursor:pointer;text-align:center}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.peligro{background:var(--badbg);color:var(--bad)}
.btn.wa{background:var(--wa)}
.btn.chico{min-height:38px;padding:7px 12px;font-size:14px}
.ancho{width:100%;margin-top:10px}
.botones{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 4px}
.botones .btn{flex:1}
.fila{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.fila .btn{flex:1}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:8px}
.conbtn{display:flex;gap:8px}
.conbtn input{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:3px;margin-top:12px}
.seg label{flex:1;margin:0!important}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:9px;border-radius:9px;color:var(--mut);font-size:15px;cursor:pointer}
.seg input:checked+span{background:var(--pri);color:#fff;font-weight:600}
.estrellas{display:flex;gap:4px;margin-top:4px}
.estrellas button{background:none;border:0;font-size:30px;color:var(--bor);padding:0 2px;cursor:pointer}
.estrellas button.on{color:#d49a12}
.item{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:10px;margin-top:8px}
.item .x{background:var(--badbg);color:var(--bad);border:0;border-radius:10px;font-size:16px;cursor:pointer}
.fac{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--warn);grid-column:span 1;white-space:nowrap}
.fac input{min-height:38px;padding:6px;width:64px;text-align:center}
.item .tres:last-child{grid-template-columns:1.2fr 1.4fr 44px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;background:var(--pri2);display:flex;align-items:center;justify-content:center;color:var(--pri);font-weight:700;cursor:pointer;border:1px solid var(--bor)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .tx{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri);vertical-align:middle}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.aviso .btn{margin-top:8px}
.vacio{text-align:center;color:var(--mut);padding:40px 20px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.dl dt{color:var(--mut)}
.dl dd{margin:0;word-break:break-word}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla td,.tabla th{padding:7px 4px;border-bottom:1px solid var(--bor);text-align:left;vertical-align:top}
.tabla th{color:var(--mut);font-weight:500;font-size:12px}
.num{text-align:right!important;white-space:nowrap}
.renglon{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--bor)}
.renglon:last-child{border-bottom:0}
.renglon.mejor{color:var(--ok);font-weight:600}
.grande{font-size:24px;font-weight:700}
h3{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
a.lnk{color:var(--pri);font-weight:600;text-decoration:none}
.pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--bor);border-radius:10px;padding:10px;font-size:14px;max-height:200px;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.visor img{width:100%;border-radius:10px;display:block}
header .der{display:flex;gap:4px}
.icard{display:flex;gap:12px;padding:10px 12px;color:inherit;text-decoration:none;align-items:flex-start}
.icard .ph{width:64px;height:64px;border-radius:10px;background:var(--pri2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--pri);font-weight:700;font-size:12px}
.icard .ph img{width:100%;height:100%;object-fit:cover}
.icard .tx{flex:1;min-width:0}
.icard .cod{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.03em}
.icard .nom{font-size:16px;line-height:1.25}
.icard .val{font-weight:700;white-space:nowrap;font-size:14px;text-align:right}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.resumen .card{margin:0;padding:10px 12px}
.resumen b{display:block;font-size:20px}
.buscar{margin:0 0 4px}
.gal{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.gal img{height:180px;border-radius:12px;cursor:pointer;flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bor);font-size:15px}
.chk input{width:22px;height:22px;min-height:0;flex:none}
.ok-ic{color:var(--ok);font-weight:700}
.bad-ic{color:var(--bad);font-weight:700}
video#cam{width:100%;border-radius:12px;background:#000;display:block}
#print{display:none}
.card.sel{outline:3px solid var(--pri);outline-offset:-1px}
.card .marca{display:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--bor);flex:none;align-self:center;align-items:center;justify-content:center;color:#fff;font-size:14px}
body.selmodo .card .marca{display:flex}
.card.sel .marca{background:var(--pri);border-color:var(--pri)}
#selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;background:var(--card);border-top:1px solid var(--bor);padding:10px 16px;display:flex;gap:8px;align-items:center}
#selbar .cnt{flex:1;font-weight:600;white-space:nowrap;font-size:14px}
.barra{display:flex;justify-content:flex-end;margin:-4px 0 8px}
@media print{
  @page{size:letter portrait;margin:12.7mm 4.8mm 0 4.8mm}
  body>*:not(#print){display:none!important}
  #print{display:grid!important;grid-template-columns:repeat(3,66.7mm);column-gap:3.2mm;grid-auto-rows:25.4mm}
  body{background:#fff;color:#000}
  .et{display:flex;gap:2mm;align-items:center;padding:1.5mm 2mm;overflow:hidden;font:8pt/1.15 system-ui,sans-serif;color:#000;break-inside:avoid}
  .et svg{width:21mm;height:21mm;flex:none}
  .et b{font-size:10pt;display:block}
  .et .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
.chips.sub{padding-top:2px}
.seis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin-top:8px}.seis div{display:flex;flex-direction:column;font-size:15px}.seis .mut{font-size:12px}.warn-tx{color:var(--warn)}.col6{cursor:pointer}

</style>
</head>

<datalist id="dl-cat"></datalist><datalist id="dl-mun"></datalist><datalist id="dl-mat"></datalist><datalist id="dl-und"></datalist><datalist id="dl-mcat"></datalist><datalist id="dl-ubic"></datalist><datalist id="dl-imat"></datalist><datalist id="dl-col"></datalist>

<script>
'use strict';
/* Gestión de materiales: une las apps Proveedores e Inventario del taller. Datos solo en el celular (IndexedDB). */
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoyISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const diasDesde=f=>Math.floor((new Date(hoyISO())-new Date(f))/864e5);
const fechaTxt=f=>{if(!f)return'';const [y,m,d]=String(f).slice(0,10).split('-');return d+'/'+m+'/'+y};
const fmt$=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const fmtN=n=>(Math.round((n||0)*100)/100).toLocaleString('es-CO');
const IVA=0.19;
function parsePesos(s){const t=String(s??'').replace(/\./g,'').replace(',','.').replace(/[^\d.]/g,'');return parseFloat(t)||0}
function parseNum(s){s=String(s??'').trim().replace(/[^\d.,-]/g,'');if(!s)return NaN;const c=s.lastIndexOf(','),p=s.lastIndexOf('.');
  if(c>-1&&p>-1){s=c>p?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(c>-1){s=(s.match(/,/g).length>1)?s.replace(/,/g,''):s.replace(',','.')}
  else if(p>-1){const pt=s.split('.');if(pt.length>2)s=s.replace(/\./g,'');else if(pt[1].length===3&&/^-?[1-9]\d*$/.test(pt[0]))s=s.replace('.','')}
  return parseFloat(s)}
function parseNumDec(s,dec){s=String(s??'').trim().replace(/[^\d.,-]/g,'');if(!s)return NaN;s=dec===','?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');return parseFloat(s)}
function detectDec(vals){let c=0,p=0;for(const v of vals){const a=v.lastIndexOf(','),b=v.lastIndexOf('.');if(a>-1&&b>-1){a>b?c++:p++}else if(a>-1)c++;else if(b>-1)p++}return c>p?',':'.'}
function intl(t){let d=String(t||'').replace(/\D/g,'');if(d.length===10)d='57'+d;return d}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
const vacio=m=>'<div class="vacio">'+m+'</div>';
function num(s){s=String(s??'').trim().replace(',','.').replace(/[^\d.-]/g,'');const v=parseFloat(s);return isNaN(v)?null:v}
/* ===== íconos ===== */
const P={people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c3 .2 5.5 2.2 5.5 5.3"/>',
doc:'<path d="M6 2.5h8.5L19 7v14.5H6z"/><path d="M14 2.5V7h5M9 12h7M9 16h7"/>',
box:'<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
folder:'<path d="M3 6.5h6l2 2h10v11H3z"/>',
cloud:'<path d="M7 18.5a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 8.5a4 4 0 0 1 0 10z"/><path d="M12 16v-5m-2.5 2.5L12 11l2.5 2.5"/>',
tel:'<path d="M5 3.5h3.5l1.5 4-2 1.5a11 11 0 0 0 7 7l1.5-2 4 1.5V19a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>',
wa:'<path d="M4 20l1.3-3.8A8.5 8.5 0 1 1 8 19z"/><path d="M9 9.5c.5 2.5 2.5 4.5 5 5"/>',
map:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
cam:'<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',
clip:'<path d="M20 11.5 12 19.5a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7"/>',
share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/>',
up:'<path d="M12 16V4m-5 5 5-5 5 5M4 20h16"/>'};
Object.assign(P,{
ruler:'<path d="M3 15.5 15.5 3 21 8.5 8.5 21z"/><path d="m7 11.5 2 2M10 8.5l2 2M13 5.5l2 2M5.5 14.5l1.2 1.2M8.5 11.5l1.2 1.2"/>',
kit:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z"/><path d="M13 16.5h7M16.5 13v7" stroke-dasharray="2 2"/>',
tag:'<path d="M3 12V4h8l9.5 9.5-8 8z"/><circle cx="7.5" cy="8" r="1.5"/>',
qr:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',
out:'<path d="M14 4h6v16h-6M3 12h12m-4-4 4 4-4 4"/>',
cut:'<circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8 8.5 20 17M8 15.5 20 7"/>'});
const ic={};for(const k in P)ic[k]='<svg class="i" viewBox="0 0 24 24">'+P[k]+'</svg>';
/* ===== catálogos y precios ===== */
const CATS={
  tab:{n:'Tableros y retales',c:'Tableros',p:'TB',dims:1,esp:1},
  mad:{n:'Madera maciza',c:'Madera',p:'MA',dims:1,esp:1},
  arm:{n:'Muebles armados',c:'Muebles',p:'MU',dims:1,alto:1},
  tej:{n:'Tejas',c:'Tejas',p:'TE',dims:1},
  her:{n:'Herrajes',c:'Herrajes',p:'HE'},
  pin:{n:'Pinturas y tintes',c:'Pinturas',p:'PI',resto:1},
  met:{n:'Metales',c:'Metales',p:'ME',dims:1},
  otr:{n:'Otros',c:'Otros',p:'OT',dims:1}};
const ESTADOS=['Bueno','Con detalles','Por revisar','Para descartar'];
const RESTOS=[[1,'Lleno'],[0.75,'3/4'],[0.5,'Mitad'],[0.25,'1/4'],[0.1,'Casi vacío']];
const UNDS=['und','m²','ml','tablero','par','juego','galón','cuarto','cuñete','kg','rollo','paquete','lote'];
const PROY_BASE=['Taller','Suesca','Silvania – Villa del Monte','Fontanar','Tibaná y Guaduas','Paneles estudio'];
const UBIC_BASE=['Rack tableros','Rack madera','Ventana','Estante herrajes','Estante pinturas','Piso taller','Bodega'];
const contacto=id=>S.contactos.find(x=>x.id===id);
const material=id=>S.materiales.find(x=>x.id===id);
const matPorNombre=n=>S.materiales.find(m=>norm(m.nombre)===norm(n));
async function materialId(nombre,unidad){const n=String(nombre||'').trim();if(!n)return null;let m=matPorNombre(n);if(!m){m={id:uid(),nombre:n,unidad:(unidad||'und').trim()||'und',categoria:''};await guardar('materiales',m);refrescarListas()}return m.id}
const CAT_BASE=['Ferretería','Hierro y acero','Madera','Cemento y agregados','Bloque y ladrillo','Eléctrico','Hidrosanitario','Pinturas','Vidrio y aluminio','Maestro de obra','Carpintero','Soldador','Electricista','Plomero','Transporte','Alquiler de equipo'];
const UND_BASE=['und','m','ml','m²','m³','kg','bulto','varilla','galón','cuñete','rollo','tablero','lámina','viaje','día','global'];
const vencida=c=>diasDesde(c.fecha)>(+c.vigencia||30);
function precioSin(it){return it.iva==='incl'?it.precio/(1+IVA):it.precio}
function ofertas(matId){const map={};
  for(const c of S.cotizaciones){if(!contacto(c.contactoId))continue;for(const it of (c.items||[])){if(it.materialId!==matId||!(it.precio>0))continue;const prev=map[c.contactoId];if(!prev||c.fecha>prev.cot.fecha)map[c.contactoId]={cot:c,it}}}
  return Object.values(map).map(o=>{const f=o.it.factor>0?o.it.factor:1;return{...o,contacto:contacto(o.cot.contactoId),unit:precioCon(o.it)/f,unitSin:precioSin(o.it)/f,vencida:vencida(o.cot)}}).sort((a,b)=>a.unit-b.unit)}
const mejorOf=ofs=>ofs.find(o=>!o.vencida)||ofs[0]||null;
const precioCon=p=>p.iva==='mas'?p.precio*(1+IVA):p.precio;
const item=id=>S.items.find(x=>x.id===id);
const kit=id=>S.kits.find(x=>x.id===id);
const precio=id=>S.precios.find(x=>x.id===id);
function nextCod(cat){const p=(CATS[cat]||CATS.otr).p;let m=0;for(const x of S.items){const r=String(x.cod||'').match(new RegExp('^'+p+'-(\\d+)$'));if(r)m=Math.max(m,+r[1])}return p+'-'+String(m+1).padStart(3,'0')}
/* ===== valor ===== */
function valor(it){return valorCon(it,precio)}
function valorCon(it,precioDe){const cant=+it.cant||0;const resto=it.cat==='pin'?(+it.resto||1):1;
  if(+it.valorUnit>0)return{total:it.valorUnit*cant*resto,unit:+it.valorUnit,q:cant*resto,und:it.und||'und',manual:true};
  const p=precioDe(it.precioId);if(!p||!(p.precio>0))return{total:0,sin:true};
  const pu=precioCon(p);let q;
  if(+it.cantVal>0)q=+it.cantVal;
  else if(p.unidad==='m²')q=(it.largo>0&&it.ancho>0)?it.largo*it.ancho/1e6*cant:null;
  else if(p.unidad==='ml')q=it.largo>0?it.largo/1000*cant:null;
  else q=cant;
  if(q==null)return{total:0,sin:true,falta:'medidas'};
  q*=resto;return{total:pu*q,unit:pu,q,und:p.unidad,p}}
const valorKit=k=>S.items.filter(i=>i.kitId===k.id).reduce((s,i)=>s+valor(i).total,0);
function fmtDims(it){const u=it.cat==='arm'?10:1,un=it.cat==='arm'?' cm':' mm';const v=[it.largo,it.ancho,it.cat==='arm'?it.alto:it.esp].filter(x=>x>0).map(x=>fmtN(x/u));
  let t=v.length?v.join(' × ')+un:'';if(it.seccion)t+=(t?' · ':'')+it.seccion;return t}

async function comprimir(file){if(!file.type.startsWith('image/'))return file;try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',0.75))}catch(e){return file}}
function thumbEl(blob,onX,onClick){const d=document.createElement('div');d.className='thumb';if(blob.type&&blob.type.startsWith('image/')){const im=new Image();im.src=URL.createObjectURL(blob);d.append(im)}else d.innerHTML='<span>PDF</span>';

/* ---------- base de datos (IndexedDB, en el celular) ---------- */
const STORES=['contactos','cotizaciones','materiales','precios','proyectos','ubicaciones','lista','compras','items','kits','movs','fotos','meta'];
const DATOS=STORES.filter(s=>s!=='fotos'&&s!=='meta');
let db;
function abrirDB(){return new Promise((res,rej)=>{const r=indexedDB.open('materiales-db',1);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const ost=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbAll=s=>rq(ost(s).getAll()),dbGet=(s,id)=>rq(ost(s).get(id)),dbPut=(s,o)=>rq(ost(s,'readwrite').put(o)),dbDel=(s,id)=>rq(ost(s,'readwrite').delete(id)),dbClear=s=>rq(ost(s,'readwrite').clear());
const S={};DATOS.forEach(k=>S[k]=[]);
let META={};
async function cargar(){for(const k of DATOS)S[k]=await dbAll(k);META={};(await dbAll('meta')).forEach(x=>META[x.id]=x.v);recalcular()}
/* La cantidad de un ítem nunca se guarda: sale de sumar sus movimientos (kardex). */
async function guardar(s,o){o.mod=new Date().toISOString();let g=o;if(s==='items'){g={...o};delete g.cant}await dbPut(s,g);const i=S[s].findIndex(x=>x.id===o.id);if(i>=0)S[s][i]=o;else S[s].push(o);if(s==='movs'||s==='items')recalcular()}
async function borrar(s,id){await dbDel(s,id);S[s]=S[s].filter(x=>x.id!==id);if(s==='movs'||s==='items')recalcular()}
async function setMeta(k,v){META[k]=v;await dbPut('meta',{id:k,v})}

/* ---------- proyectos (ids oficiales de proyectos.json en Obras-base) y ubicaciones ---------- */
const PROY_OFICIALES=[{id:'tibana-y-guaduas',nombre:'Tibaná y Guaduas'},{id:'silvania',nombre:'Silvania'},{id:'suesca',nombre:'Suesca'},{id:'fontanar',nombre:'Fontanar'}];
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'x';
const proyecto=id=>S.proyectos.find(x=>x.id===id);
const nomProy=id=>id?((proyecto(id)||{}).nombre||id):'';
const proyOrden=()=>[...S.proyectos].sort((a,b)=>(a.local?1:0)-(b.local?1:0)||a.nombre.localeCompare(b.nombre,'es'));
function proyectoPorNombre(n){const k=norm(n);if(!k)return null;
  return S.proyectos.find(p=>norm(p.nombre)===k||p.id===k)||S.proyectos.find(p=>!p.local&&(k.startsWith(norm(p.nombre)+' ')||k.startsWith(norm(p.nombre)+'-')||k.startsWith(norm(p.nombre)+' –')))||null}
async function asegurarUbicProyecto(p){if(!S.ubicaciones.find(u=>u.proyectoId===p.id))await guardar('ubicaciones',{id:'u-p-'+p.id,nombre:p.nombre,tipo:'proyecto',proyectoId:p.id})}
async function asegurarProyecto(n){if(!String(n||'').trim())return '';let p=proyectoPorNombre(n);
  if(!p){const id='l-'+slug(n);p=proyecto(id)||{id,nombre:String(n).trim(),estado:'activo',conPagina:false,local:true};if(!proyecto(id))await guardar('proyectos',p)}
  await asegurarUbicProyecto(p);return p.id}
const ubicacion=id=>S.ubicaciones.find(u=>u.id===id);
const nomUbic=id=>id==='proveedor'?'Proveedor':((ubicacion(id)||{}).nombre||'—');
const ubicDeProyecto=pid=>pid?'u-p-'+pid:'';
async function ubicId(n){n=String(n||'').trim();const nom=n||'Sin ubicar';
  const ex=S.ubicaciones.find(u=>u.tipo==='bodega'&&norm(u.nombre)===norm(nom));if(ex)return ex.id;
  const id=n?'u-'+slug(n):'u-sin';if(!ubicacion(id))await guardar('ubicaciones',{id,nombre:nom,tipo:'bodega'});return id}
async function asegurarBase(){for(const o of PROY_OFICIALES)if(!proyecto(o.id))await guardar('proyectos',{...o,estado:'activo',conPagina:true,local:false});
  for(const p of S.proyectos)await asegurarUbicProyecto(p);
  if(!S.ubicaciones.some(u=>u.tipo==='bodega'))for(const n of UBIC_BASE)await ubicId(n);
  await ubicId('')}

/* ---------- KARDEX: la existencia sale de sumar movimientos; un movimiento no se edita ---------- */
const TIPOS={entrada:'Entrada',recepcion:'Recepción',salida:'Salida a obra',traslado:'Traslado',devolucion:'Devolución',ajuste:'Ajuste'};
function efectos(m){const c=+m.cant||0;switch(m.tipo){
  case'entrada':case'recepcion':return[[m.destino,c]];
  case'salida':return[[m.origen,-c]];
  case'traslado':return[[m.origen,-c],[m.destino,c]];
  case'devolucion':return m.destino==='proveedor'?[[m.origen,-c]]:[[m.origen,-c],[m.destino,c]];
  case'ajuste':return[[m.destino,c]];default:return[]}}
let EXI={};
function recalcular(){EXI={};for(const m of S.movs){const k=m.itemId?'i:'+m.itemId:m.materialId?'m:'+m.materialId:null;if(!k)continue;const e=EXI[k]||(EXI[k]={});
    for(const [u,c] of efectos(m)){const uu=u||'u-sin';e[uu]=(e[uu]||0)+c}}
  for(const it of S.items)it.cant=Math.round(Object.values(EXI['i:'+it.id]||{}).reduce((s,x)=>s+x,0)*1000)/1000}
const existencia=k=>Math.round(Object.values(EXI[k]||{}).reduce((s,x)=>s+x,0)*1000)/1000;
const existPorUbic=k=>Object.entries(EXI[k]||{}).filter(x=>Math.abs(x[1])>1e-9);
async function mov(o){const m={id:o.id||uid(),fecha:o.fecha||hoyISO(),tipo:o.tipo,itemId:o.itemId||null,materialId:o.materialId||null,cant:+o.cant||0,und:o.und||'',origen:o.origen||'',destino:o.destino||'',proyectoId:o.proyectoId||'',compraId:o.compraId||'',valor:+o.valor||0,nota:o.nota||'',creado:new Date().toISOString()};
  if(m.itemId){const it=item(m.itemId);if(it){m.cod=it.cod;m.nombre=it.nombre}}else if(m.materialId){const mm=material(m.materialId);if(mm)m.nombre=mm.nombre}
  await guardar('movs',m);return m}
function descMov(m){const d=[];if(m.tipo==='entrada'||m.tipo==='recepcion')d.push('a '+nomUbic(m.destino));
  else if(m.tipo==='salida')d.push(nomProy(m.proyectoId)||'obra');else if(m.tipo==='traslado')d.push(nomUbic(m.origen)+' → '+nomUbic(m.destino));
  else if(m.tipo==='devolucion')d.push(nomUbic(m.origen)+' → '+nomUbic(m.destino));else if(m.tipo==='ajuste')d.push(nomUbic(m.destino));
  return (TIPOS[m.tipo]||m.tipo)+' · '+d.join('')}
const cantMov=m=>{const s=m.tipo==='salida'||(m.tipo==='devolucion'&&m.destino==='proveedor')?-1:1;return (m.tipo==='ajuste'&&m.cant>0?'+':'')+fmtN(s*(+m.cant||0))+' '+(m.und||'')};

async function leerTexto(f){const b=new Uint8Array(await f.arrayBuffer());let t;if(b[0]===0xFF&&b[1]===0xFE)t=new TextDecoder('utf-16le').decode(b);else if(b[0]===0xFE&&b[1]===0xFF)t=new TextDecoder('utf-16be').decode(b);else{try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('windows-1252').decode(b)}}return t.replace(/^\uFEFF/,'')}
function parseCSV(txt){const t=txt.replace(/\r\n?/g,'\n');const muestra=t.split('\n').slice(0,15).join('\n');const del=muestra.includes('\t')?'\t':(muestra.includes(';')?';':',');
  const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"'&&cell.trim()==='')q=true;else if(ch===del){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(Boolean))}
function splitNumUnit(s){const m=String(s||'').trim().match(/^(-?[\d.,]+)\s*(.*)$/);return m?{num:m[1],u:m[2].trim()}:{num:'',u:''}}
function formCSV(pid){abrirModal('<div class="frm"><h2>Importar lista</h2><p class="mut">En Revit: tabla de cantidades → Archivo → Exportar → Informes → Tabla. Sirve el .txt o un .csv de Excel. Luego pásalo al celular (Drive, WhatsApp, cable).</p><label class="btn sec ancho">'+ic.up+' Elegir archivo<input type="file" id="fcsv" accept=".csv,.txt,text/csv,text/plain,text/tab-separated-values" hidden></label><div id="cfg"></div><div class="botones"><button class="btn sec" data-cerrar>Cancelar</button></div></div>',h=>{
  $('#fcsv',h).onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=parseCSV(await leerTexto(f));if(rows.length<2)return toast('El archivo no tiene datos');configCSV(h,rows,pid)}})}
function configCSV(h,rows,pid){const ncol=Math.max(...rows.map(r=>r.length));let hi=rows.findIndex(r=>r.filter(Boolean).length>=2);if(hi<0)hi=0;
  const cfg={hi,cMat:-1,c2:-1,cCant:-1,cUnd:-1,desp:0};
  const nombresDe=()=>[...Array(ncol)].map((_,i)=>rows[cfg.hi][i]||('Columna '+(i+1)));
  const adivinar=()=>{const n=nombresDe();const g=re=>n.findIndex(x=>re.test(x));cfg.cMat=g(/material|descrip|nombre|tipo|type|famil|[ií]tem|elemento/i);if(cfg.cMat<0)cfg.cMat=0;
    cfg.cCant=n.findIndex((x,i)=>i!==cfg.cMat&&/cant|count|recuento|volum|[aá]rea|longitud|length|metr|total|peso|kg/i.test(x));
    if(cfg.cCant<0)cfg.cCant=n.findIndex((_,i)=>i!==cfg.cMat&&rows.slice(cfg.hi+1).some(r=>parseNum(splitNumUnit(r[i]).num)>0));
    cfg.cUnd=n.findIndex(x=>/^(unidad|und|unit|u\.?)$/i.test(x))};
  adivinar();
  const calc=()=>{const data=rows.slice(cfg.hi+1);if(cfg.cCant<0)return[];const dec=detectDec(data.map(r=>splitNumUnit(r[cfg.cCant]).num));const map=new Map();
    for(const r of data){let nom=(r[cfg.cMat]||'').trim();if(cfg.c2>=0&&r[cfg.c2])nom=(nom+' '+r[cfg.c2].trim()).trim();if(!nom||/^total/i.test(nom))continue;const sp=splitNumUnit(r[cfg.cCant]);const n=parseNumDec(sp.num,dec);if(!(n>0))continue;
      const u=((cfg.cUnd>=0?r[cfg.cUnd]:sp.u)||'').trim()||'und';const k=norm(nom)+'|'+norm(u);const ex=map.get(k);if(ex)ex.cant+=n;else map.set(k,{nombre:nom,und:u,cant:n})}return[...map.values()]};
  const sel=(id,val,opc)=>'<select id="'+id+'">'+(opc?'<option value="-1">— ninguna —</option>':'')+nombresDe().map((n,i)=>'<option value="'+i+'" '+(i===val?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select>';
  const pintar=()=>{const it=calc();
    $('#cfg',h).innerHTML='<label>Fila de encabezados<select id="shi">'+rows.slice(0,Math.min(rows.length,12)).map((r,i)=>'<option value="'+i+'" '+(i===cfg.hi?'selected':'')+'>Fila '+(i+1)+': '+esc(r.filter(Boolean).slice(0,3).join(' | ').slice(0,50))+'</option>').join('')+'</select></label>'+
    '<div class="dos"><label>Columna material'+sel('smat',cfg.cMat)+'</label><label>Sumar al nombre'+sel('sc2',cfg.c2,true)+'</label></div>'+
    '<div class="dos"><label>Columna cantidad'+sel('scant',cfg.cCant)+'</label><label>Columna unidad'+sel('sund',cfg.cUnd,true)+'</label></div>'+
    '<label>Desperdicio para todos (%)<input id="sdesp" inputmode="decimal" value="'+cfg.desp+'"></label>'+
    '<div class="lbl">Vista previa: '+it.length+' materiales</div><div class="pre">'+(it.length?it.slice(0,40).map(x=>esc(x.nombre)+' — '+fmtN(x.cant)+' '+esc(x.und)).join('\n')+(it.length>40?'\n…':''):'No encuentro cantidades con esa configuración.')+'</div>'+
    (it.length?'<div class="fila"><button class="btn" id="iadd">Agregar a la lista</button><button class="btn sec" id="irep">Reemplazar lista</button></div>':'');
    $('#shi',h).onchange=e=>{cfg.hi=+e.target.value;adivinar();pintar()};
    $('#smat',h).onchange=e=>{cfg.cMat=+e.target.value;pintar()};$('#sc2',h).onchange=e=>{cfg.c2=+e.target.value;pintar()};
    $('#scant',h).onchange=e=>{cfg.cCant=+e.target.value;pintar()};$('#sund',h).onchange=e=>{cfg.cUnd=+e.target.value;pintar()};
    $('#sdesp',h).onchange=e=>{cfg.desp=parseNum(e.target.value)||0};
    const go=async rep=>{if(rep&&!confirm('¿Borrar la lista actual y dejar solo lo importado?'))return;cfg.desp=parseNum($('#sdesp',h).value)||0;const n=await importar(it,pid,cfg.desp,rep);toast(n+' materiales importados');cerrarModal(()=>render(false))};
    const a=$('#iadd',h),b=$('#irep',h);if(a)a.onclick=()=>go(false);if(b)b.onclick=()=>go(true)};
  pintar()}

function vRetal(){setTop('Buscar retal por medida');setFab(null);

    '<label class="chk" style="border:0"><input type="checkbox" id="rlib"'+(rf.libres?' checked':'')+'>Solo libres (no apartados)</label></div><div id="rres"></div>';
  const go=()=>{rf={q:$('#rq').value,l:$('#rl').value,a:$('#ra').value,esp:$('#re').value,libres:$('#rlib').checked};
    const L=num(rf.l)||0,A=num(rf.a)||0,E=num(rf.esp),q=norm(rf.q);
    const r=S.items.filter(it=>(it.cat==='tab'||it.cat==='mad'||it.cat==='otr')&&+it.cant>0&&it.largo>0&&(!rf.libres||!it.apartado)&&it.estado!=='Para descartar').filter(it=>{

      if(E!=null&&!(Math.abs((+it.esp||0)-E)<=0.6))return false;
      const l=+it.largo,a=+it.ancho||0;return (l>=L&&a>=A)||(a>=L&&l>=A)}).map(it=>({it,girada:!((+it.largo)>=L&&(+it.ancho||0)>=A)}))
      .sort((x,y)=>(x.it.largo*(x.it.ancho||1))-(y.it.largo*(y.it.ancho||1)));
    $('#rres').innerHTML=(L||A||q?'<h3>'+r.length+' sirven · del más pequeño al más grande</h3>':'<h3>Escribe una medida</h3>')+r.map(x=>cardItem(x.it,x.girada?'<div class="tags"><span class="tag">Cabe girada</span></div>':'')).join('');pintarFotos($('#rres'))};
  $$('#vista input').forEach(i=>i.oninput=go);$('#rlib').onchange=go;go()}

/* ---------- MUEBLES DESARMADOS (kits) ---------- */
function estadoKit(k){const pzs=S.items.filter(i=>i.kitId===k.id&&+i.cant>0);const esp=k.piezas||[];
  const filas=esp.map(p=>{const hay=pzs.filter(i=>norm(i.pieza)===norm(p.nombre)).reduce((s,i)=>s+(+i.cant||0),0);return{...p,hay}});
  const falta=filas.filter(f=>f.hay<(+f.cant||1));const extra=pzs.filter(i=>!esp.some(p=>norm(p.nombre)===norm(i.pieza)));
  return{pzs,filas,falta,extra,completo:esp.length>0&&!falta.length}}
function vKits(){setTop('Muebles desarmados');setFab(()=>formKit());
  const L=[...S.kits].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  $('#vista').innerHTML='<p class="mut">Cada mueble desarmado tiene su lista de piezas (el despiece). La app compara con las piezas que vas encontrando en el taller y dice qué falta.</p>'+

  return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}

const reparto=(c,it)=>(it.reparto&&it.reparto.length)?it.reparto:[{proyectoId:c.proyectoId,cant:baseCant(it)}];
const idsCompra=cid=>{const c=compra(cid);return [cid,...((c&&c.alias)||[])]};
const recibidoCompra=(cid,mid,pid)=>{const ids=idsCompra(cid);return S.movs.filter(m=>ids.includes(m.compraId)&&m.materialId===mid&&(m.tipo==='entrada'||m.tipo==='recepcion')&&(!pid||m.proyectoId===pid))
  .reduce((s,m)=>s+(+m.cant||0),0)};
function estadoCompra(c){if(c.unidoA)return'unido';if(c.noAplica)return'no aplica';if(!(c.items||[]).length)return'por detallar';
  let tot=0,rec=0;for(const it of c.items){tot+=baseCant(it);rec+=Math.min(recibidoCompra(c.id,it.materialId),baseCant(it))}
  return rec<=1e-9?'pedida':rec+1e-9<tot?'parcial':'recibida'}

function columnas(pid){const R={};const fila=mid=>R[mid]||(R[mid]={mid,pres:0,comp:0,rec:0,usado:0,lista:null});
  for(const l of S.lista.filter(l=>l.proyectoId===pid)){const r=fila(l.materialId);r.pres+=(+l.cant||0)*(1+(l.desp||0)/100);r.lista=l}
  for(const c of S.compras)if(!c.noAplica&&!c.unidoA)for(const it of (c.items||[]))for(const rp of reparto(c,it))if(rp.proyectoId===pid)fila(it.materialId).comp+=+rp.cant||0;
  for(const m of S.movs)if(m.materialId&&m.proyectoId===pid){
    if((m.tipo==='entrada'||m.tipo==='recepcion')&&m.compraId)fila(m.materialId).rec+=+m.cant||0;
    if(m.tipo==='salida')fila(m.materialId).usado+=+m.cant||0}
  return Object.values(R).map(r=>{const m=material(r.mid);return m?{...r,m,pend:r.comp-r.rec,falta:r.pres-r.comp,controla:!!m.controlarUso}:null}).filter(Boolean).sort((a,b)=>a.m.nombre.localeCompare(b.m.nombre,'es'))}

function parecidoProv(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;if(a===b||a.includes(b)||b.includes(a))return true;
  const tk=x=>new Set(x.split(/[^a-z0-9]+/).filter(w=>w.length>2));const A=tk(a),B=tk(b);let n=0;A.forEach(w=>{if(B.has(w))n++});return n>0&&n/Math.min(A.size,B.size)>=0.5}
function candidatosUnion(c){if(!c||c.local||c.unidoA)return[];return S.compras.filter(l=>l.local&&!l.unidoA&&!(c.noUnir||[]).includes(l.id)&&l.proyectoId===c.proyectoId&&parecidoProv(l.proveedor,c.proveedor)&&

    const g=n=>d.querySelector('[name='+n+']');const upd=()=>{const mm=matPorNombre(g('mat').value);const u=g('und').value.trim();const fac=d.querySelector('.fac');if(mm&&u&&norm(u)!==norm(mm.unidad)){fac.hidden=false;fac.querySelector('.u1').textContent=u;fac.querySelector('.ub').textContent=mm.unidad}else{fac.hidden=true;g('factor').value=1}};

    '<div id="its"></div><button type="button" class="btn sec ancho" id="addi">+ Material</button><label>Flete de la compra $ (opcional, solo referencia)<input name="flete" inputmode="numeric" value="'+(c.flete?Math.round(c.flete).toLocaleString('es-CO'):'')+'"></label>'+

        const o={materialId:mid,cant,und,factor,precio:parsePesos(g('precio'))||null};const b=cant*factor;

async function formRecibir(c){const filas=[];for(const it of c.items)for(const r of reparto(c,it)){const pend=(+r.cant||0)-recibidoCompra(c.id,it.materialId,r.proyectoId);if(pend>1e-9)filas.push({it,r,pend})}

      if(tipo==='recibir')await mov({...o,tipo:'entrada',cant:c,destino:f.dest.value,proyectoId:f.pid.value});

function sobrantesDe(pid){const u=ubicDeProyecto(pid);const out=[];

  return out.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'))}

/* ---------- MATERIALES: ficha, historial de precios y comparador ---------- */
function historial(id){const H=[];
  for(const p of S.precios.filter(p=>p.materialId===id&&p.precio>0))H.push({fecha:p.fecha||'',unit:precioCon(p),iva:p.iva,fuente:p.estimado?'Estimado':'Referencia',quien:p.fuente||'',contactoId:p.contactoId||'',vigente:true,ref:p});
  for(const q of S.cotizaciones)for(const it of (q.items||[])){if(it.materialId!==id||!(it.precio>0))continue;const f=it.factor>0?it.factor:1;const c=contacto(q.contactoId);
    H.push({fecha:q.fecha,unit:precioCon(it)/f,iva:it.iva,fuente:'Cotización',quien:c?c.nombre:'',contactoId:q.contactoId,vigente:!vencida(q),cot:q})}
  H.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const vig=H.filter(h=>h.vigente);const min=vig.length?Math.min(...vig.map(h=>h.unit)):null;
  const alzas=[];const porC={};[...H].reverse().forEach(h=>{if(!h.contactoId)return;const prev=porC[h.contactoId];if(prev&&h.unit>prev.unit*1.10)alzas.push({h,prev});porC[h.contactoId]=h});
  return{H,min,alzas}}

/* ---------- SUMAR DATOS: buzón, archivos y migración (nunca duplica: usa los id) ---------- */
const blobAData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function blobDe(f){return f.blob||await (await fetch(f.data)).blob()}
async function sumarFotos(L,n){for(const f of (L||[]))if(f&&f.id&&!(await dbGet('fotos',f.id))){await dbPut('fotos',{id:f.id,blob:await blobDe(f)});n.f++}}
async function materialDePrecio(p){if(p.materialId&&material(p.materialId))return p.materialId;
  const ex=S.materiales.find(m=>norm(m.nombre)===norm(p.nombre)&&norm(m.unidad)===norm(p.unidad||'und'));if(ex)return ex.id;
  const id='m-'+p.id;if(!material(id)){const choca=matPorNombre(p.nombre);await guardar('materiales',{id,nombre:choca?p.nombre+' ('+(p.unidad||'und')+')':p.nombre,unidad:p.unidad||'und',categoria:p.grupo||'',controlarUso:false})}return id}
const nuevoN=()=>({c:0,q:0,m:0,f:0,p:0,i:0,k:0,pr:0,mv:0,co:0,a:0});
async function sumarProv(d,n=nuevoN()){const mapC={},mapM={},mapP={};
  for(const p of (d.proyectos||[])){const antes=S.proyectos.length;mapP[p.id]=await asegurarProyecto(p.nombre);if(S.proyectos.length>antes)n.p++}
  for(const c of (d.contactos||[])){const ex=S.contactos.find(x=>x.id===c.id)||S.contactos.find(x=>(c.tel&&x.tel&&intl(x.tel)===intl(c.tel))||norm(x.nombre)===norm(c.nombre));
    if(ex){mapC[c.id]=ex.id;const m={...ex};let cambio=false;for(const k in c){if(k==='id'||k==='creado'||k==='_reemplazar')continue;if((m[k]==null||m[k]==='')&&c[k]!=null&&c[k]!==''){m[k]=c[k];cambio=true}}
      if(c.notas&&ex.notas&&!norm(ex.notas).includes(norm(c.notas))){m.notas=ex.notas+'\n\n'+c.notas;cambio=true}if(cambio)await guardar('contactos',m)}
    else{mapC[c.id]=c.id;await guardar('contactos',c);n.c++}}
  for(const m of (d.materiales||[])){const ex=material(m.id)||matPorNombre(m.nombre);if(ex)mapM[m.id]=ex.id;else{mapM[m.id]=m.id;await guardar('materiales',{controlarUso:false,...m});n.m++}}
  await sumarFotos(d.fotos,n);
  const pid=x=>x?(mapP[x]||(proyecto(x)?x:'')):'';
  for(const q of (d.cotizaciones||[]))if(!S.cotizaciones.find(x=>x.id===q.id)){
    await guardar('cotizaciones',{...q,proyectoId:pid(q.proyectoId),contactoId:mapC[q.contactoId]||q.contactoId,items:(q.items||[]).map(it=>({...it,materialId:mapM[it.materialId]||it.materialId}))});n.q++}
  for(const l of (d.lista||[]))if(!S.lista.find(x=>x.id===l.id))await guardar('lista',{...l,proyectoId:pid(l.proyectoId),materialId:mapM[l.materialId]||l.materialId});
  refrescarListas();return n}
async function sumarInv(d,n=nuevoN()){

  for(const nm of (d.ubicaciones||[]))await ubicId(nm);
  await sumarFotos(d.fotos,n);
  for(const p of (d.precios||[])){const ex=precio(p.id);
    if(!ex){const o={...p};delete o._reemplazar;o.materialId=await materialDePrecio(o);await guardar('precios',o);n.pr++}
    else if(p._reemplazar||(p.fecha&&(!ex.fecha||p.fecha>ex.fecha))){const o={...ex,...p};delete o._reemplazar;if(!o.materialId)o.materialId=await materialDePrecio(o);await guardar('precios',o);n.a++}}
  for(const k of (d.kits||[])){const ex=kit(k.id);if(!ex){await guardar('kits',k);n.k++}else if(k._reemplazar){const o={...ex,...k};delete o._reemplazar;await guardar('kits',o);n.a++}}
  const viejos=(d.movs||[]).filter(m=>!m.tipo);const salio=id=>viejos.filter(m=>m.itemId===id).reduce((s,m)=>s+(+m.cant||0),0);
  for(const it of (d.items||[])){const ex=item(it.id);const ap=it.apartado&&!proyecto(it.apartado)?await asegurarProyecto(it.apartado):(it.apartado||'');
    if(!ex){const o={...it,apartado:ap};delete o._reemplazar;delete o.cant;if(!o.cod||S.items.some(x=>x.cod===o.cod))o.cod=nextCod(o.cat);await guardar('items',o);n.i++;
      const ini=Math.round(((+it.cant||0)+salio(it.id))*1000)/1000;
      if(ini>0&&!S.movs.find(m=>m.id==='ini-'+it.id)){await mov({id:'ini-'+it.id,tipo:'entrada',itemId:o.id,cant:ini,und:it.und,destino:await ubicId(it.ubic),fecha:String(it.creado||'').slice(0,10)||hoyISO(),nota:'Saldo inicial'});n.mv++}}
    else if(it._reemplazar){const o={...ex,...it,apartado:ap,cod:ex.cod,fotos:[...new Set([...(ex.fotos||[]),...(it.fotos||[])])]};delete o._reemplazar;const cantNueva=it.cant;o.cant=ex.cant;
      if(it.ubic!=null&&norm(it.ubic)!==norm(ex.ubic)&&ex.cant>0)await mov({tipo:'traslado',itemId:ex.id,cant:ex.cant,und:ex.und,origen:await ubicId(ex.ubic),destino:await ubicId(it.ubic),nota:'Cambio de ubicación (buzón)'});
      await guardar('items',o);
      if(cantNueva!=null&&Math.abs(cantNueva-ex.cant)>1e-9)await mov({tipo:'ajuste',itemId:ex.id,cant:Math.round((cantNueva-ex.cant)*1000)/1000,und:ex.und,destino:await ubicId(o.ubic),nota:'Corrección por buzón'});n.a++}}
  for(const m of (d.movs||[])){if(S.movs.find(x=>x.id===m.id))continue;
    if(m.tipo){await guardar('movs',m);n.mv++;continue}
    const it=item(m.itemId);await mov({id:m.id,tipo:'salida',itemId:m.itemId,cant:+m.cant||0,und:it?it.und:'',origen:await ubicId(it?it.ubic:''),proyectoId:await asegurarProyecto(m.proyecto),valor:m.valor,fecha:m.fecha,nota:m.det||''});n.mv++}
  refrescarListas();return n}
async function sumarMat(d,n=nuevoN()){const ya=(s,id)=>S[s].some(x=>x.id===id);
  if(d.proveedores)await sumarProv(d.proveedores,n);if(d.inventario)await sumarInv(d.inventario,n);
  await sumarFotos(d.fotos,n);
  for(const p of (d.proyectos||[]))if(!ya('proyectos',p.id)){await guardar('proyectos',p);await asegurarUbicProyecto(p);n.p++}

      else if(o._reemplazar){const ex=S[s].find(x=>x.id===o.id);const x={...ex,...o};delete x._reemplazar;if(s==='items')x.cant=ex.cant;await guardar(s,x);n.a++}}
  for(const m of (d.movs||[]))if(!ya('movs',m.id)){await guardar('movs',m);n.mv++}

    else if(c._reemplazar){const x={...ex};for(const k of ['proyectoId','fecha','proveedor','concepto','categoria','total','soportes'])if(c[k]!==undefined)x[k]=c[k];await guardar('compras',x);n.a++}}

async function leerViejaDB(nombre,stores){
  try{if(indexedDB.databases){const L=await indexedDB.databases();if(!L.some(x=>x.name===nombre))return null}}catch(e){}
  return new Promise(res=>{let nueva=false;const r=indexedDB.open(nombre);r.onupgradeneeded=()=>{nueva=true;r.transaction.abort()};r.onerror=()=>res(null);
    r.onsuccess=async()=>{const d=r.result;if(nueva){d.close();return res(null)}const out={};try{for(const s of stores)out[s]=d.objectStoreNames.contains(s)?await rq(d.transaction(s,'readonly').objectStore(s).getAll()):[]}catch(e){d.close();return res(null)}d.close();res(out)}})}
const valorTotal=(items,precioDe)=>items.reduce((s,i)=>s+valorCon(i,precioDe).total,0);
async function conteoNuevo(){return{contactos:S.contactos.length,cotizaciones:S.cotizaciones.length,materiales:S.materiales.length,precios:S.precios.length,items:S.items.length,kits:S.kits.length,salidas:S.movs.filter(m=>m.tipo==='salida').length,lista:S.lista.length,fotos:(await dbAll('fotos')).length,valor:Math.round(valorTotal(S.items,precio))}}
async function migrar(){
  const prov=await leerViejaDB('proveedores-db',['contactos','cotizaciones','materiales','proyectos','lista','fotos','meta']);
  const inv=await leerViejaDB('inventario-db',['items','kits','precios','movs','fotos','meta']);
  if(!prov&&!inv)return null;
  const mi=inv?Object.fromEntries((inv.meta||[]).map(x=>[x.id,x.v])):{};
  const pv=id=>(inv.precios||[]).find(x=>x.id===id);
  const antes={contactos:prov?prov.contactos.length:0,cotizaciones:prov?prov.cotizaciones.length:0,materiales:prov?prov.materiales.length:0,precios:inv?inv.precios.length:0,items:inv?inv.items.length:0,kits:inv?inv.kits.length:0,salidas:inv?inv.movs.length:0,lista:prov?prov.lista.length:0,
    fotos:(prov?prov.fotos.length:0)+(inv?inv.fotos.length:0),valor:inv?Math.round(valorTotal(inv.items,pv)):0};
  const n=nuevoN();
  if(prov)await sumarProv(prov,n);
  if(inv)await sumarInv({...inv,proyectos:mi.proyectos||PROY_BASE,ubicaciones:mi.ubicaciones||UBIC_BASE},n);
  const despues=await conteoNuevo();
  const r={fecha:new Date().toISOString(),antes,despues,nuevos:n,deProv:!!prov,deInv:!!inv};await setMeta('migracion',r);return r}

async function restaurar(file){let o;try{o=JSON.parse(await file.text())}catch(e){return alert('Ese archivo no es un respaldo válido.')}

/* ---------- BUZÓN: cargas cifradas que deja Claude en el repositorio ---------- */
async function descifrar(buf,clave){const b=new Uint8Array(buf);const salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave.trim()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)))}

    const r=await fetch('buzon/indice.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('No se pudo leer el buzón ('+r.status+')');
    const ind=await r.json();const hechos=new Set(META.buzonAplicados||[]);const nuevos=(ind.cargas||[]).filter(c=>!hechos.has(c.id));

    for(const c of nuevos){const rb=await fetch('buzon/'+c.archivo+'?t='+Date.now(),{cache:'no-store'});if(!rb.ok)throw new Error('Falta '+c.archivo);
      let o;try{o=await descifrar(await rb.arrayBuffer(),clave)}catch(e){throw new Error('La clave del buzón no abre "'+(c.desc||c.id)+'". Revísala en Más.')}
      const n=await aplicarCarga(o);if(n){for(const k in tot)tot[k]+=n[k];desc.push(c.desc||c.id)}

  if(!META.migrado){try{const r=await migrar();if(r){refrescarListas();render(false);mostrarMigracion(r)}}catch(e){alert('La migración falló: '+e.message+'\nLas apps viejas no se tocaron. Puedes repetirla desde Más.')}}
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  revisarBuzon(false);window.addEventListener('online',()=>revisarBuzon(false));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')revisarBuzon(false)});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
